<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB Business Book</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.container{
  max-width:950px;
  margin:auto;
  padding:16px
}

header{
  background:#111827;
  color:white;
  padding:22px 0
}

header h1{
  margin:0;
  font-size:25px
}

header p{
  margin:6px 0 0;
  color:#cbd5e1
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.06)
}

h2{
  margin-top:0;
  font-size:19px
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d9dee8;
  border-radius:10px;
  font-size:15px;
  background:white
}

label{
  display:block;
  font-size:13px;
  color:#64748b;
  margin-bottom:6px
}

button{
  border:0;
  border-radius:11px;
  padding:13px 15px;
  font-size:15px;
  font-weight:600;
  cursor:pointer
}

.primary{
  background:#111827;
  color:white
}

.secondary{
  background:#e5e7eb;
  color:#111827
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.full{
  width:100%
}

.hidden{
  display:none!important
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.full-column{
  grid-column:1/-1
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.stat{
  background:white;
  padding:16px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.05)
}

.stat-title{
  color:#64748b;
  font-size:13px
}

.stat-value{
  font-size:21px;
  font-weight:700;
  margin-top:7px
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.record{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:14px;
  margin-top:10px
}

.record-header{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.record-name{
  font-weight:700
}

.profit{
  font-weight:700
}

.record-info{
  color:#64748b;
  font-size:13px;
  margin-top:6px
}

.record-actions{
  display:flex;
  gap:8px;
  margin-top:12px
}

.small{
  padding:8px 11px;
  font-size:12px
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  font-size:14px
}

.error{
  background:#fee2e2;
  color:#991b1b
}

.success{
  background:#dcfce7;
  color:#166534
}

.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8
}

.login-box{
  max-width:430px;
  margin:60px auto
}

.login-logo{
  text-align:center;
  margin-bottom:20px
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.tab{
  flex:1
}

@media(max-width:700px){

  .dashboard{
    grid-template-columns:1fr 1fr
  }

  .action-grid{
    grid-template-columns:1fr 1fr
  }

}

@media(max-width:500px){

  .form-grid{
    grid-template-columns:1fr
  }

  .full-column{
    grid-column:auto
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="container">

  <div class="login-box">

    <div class="login-logo">
      <h1>AB Business Book</h1>
      <p>你的线上生意账本</p>
    </div>

    <div class="card">

      <div id="loginForm">

        <h2>🔐 登录</h2>

        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="输入你的 Email"
        >

        <br><br>

        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="输入密码"
        >

        <br><br>

        <button
          class="primary full"
          onclick="login()"
        >
          登录
        </button>

        <button
          class="secondary full"
          style="margin-top:10px"
          onclick="showForgot()"
        >
          忘记密码？
        </button>

        <div id="loginMessage"></div>

      </div>


      <!-- FORGOT PASSWORD -->

      <div id="forgotForm" class="hidden">

        <h2>🔑 忘记密码</h2>

        <p style="color:#64748b;font-size:14px">
          输入你的 Email，我们会发送密码重设链接。
        </p>

        <label>Email</label>

        <input
          id="forgotEmail"
          type="email"
          placeholder="输入你的 Email"
        >

        <br><br>

        <button
          class="primary full"
          onclick="sendResetEmail()"
        >
          📧 发送重设邮件
        </button>

        <button
          class="secondary full"
          style="margin-top:10px"
          onclick="showLogin()"
        >
          返回登录
        </button>

        <div id="forgotMessage"></div>

      </div>

    </div>

  </div>

</div>


<!-- ================= RESET PASSWORD ================= -->

<div id="resetPage" class="container hidden">

  <div class="login-box">

    <div class="card">

      <h2>🔐 设置新密码</h2>

      <p style="color:#64748b;font-size:14px">
        请设置一个新的登录密码。
      </p>

      <label>新密码</label>

      <input
        id="newPassword"
        type="password"
        placeholder="输入新密码"
      >

      <br><br>

      <label>确认新密码</label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="再次输入新密码"
      >

      <br><br>

      <button
        class="primary full"
        onclick="updatePassword()"
      >
        更新密码
      </button>

      <div id="passwordMessage"></div>

    </div>

  </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="app" class="hidden">

<header>

  <div class="container">

    <h1>AB Business Book</h1>

    <p>
      订单 · 收入 · 支出 · 盈利
    </p>

  </div>

</header>


<div class="container">

  <!-- ACCOUNT -->

  <div class="card">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    ">

      <div>

        <div style="
          color:#64748b;
          font-size:13px;
        ">
          当前账号
        </div>

        <strong id="userEmail"></strong>

      </div>

      <button
        class="secondary small"
        onclick="logout()"
      >
        登出
      </button>

    </div>

  </div>


  <!-- DASHBOARD -->

  <div class="dashboard">

    <div class="stat">

      <div class="stat-title">
        今日订单
      </div>

      <div
        class="stat-value"
        id="todayOrders"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        今日收入
      </div>

      <div
        class="stat-value"
        id="todayIncome"
      >
        RM 0.00
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        今日支出
      </div>

      <div
        class="stat-value"
        id="todayExpense"
      >
        RM 0.00
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        今日盈利
      </div>

      <div
        class="stat-value"
        id="todayProfit"
      >
        RM 0.00
      </div>

    </div>

  </div>


  <br>


  <!-- ACTIONS -->

  <div class="action-grid">

    <button
      class="primary"
      onclick="openForm('order')"
    >
      ＋ 新增订单
    </button>

    <button
      class="primary"
      onclick="openForm('expense')"
    >
      ＋ 新增支出
    </button>

    <button
      class="secondary"
      onclick="showToday()"
    >
      📅 今天
    </button>

    <button
      class="secondary"
      onclick="showAll()"
    >
      📋 全部
    </button>

  </div>


  <br>


  <!-- FORM -->

  <div
    id="formPanel"
    class="card hidden"
  >

    <h2 id="formTitle">
      新增订单
    </h2>

    <div class="form-grid">

      <div>

        <label>日期</label>

        <input
          id="date"
          type="date"
        >

      </div>


      <div>

        <label>顾客 / 项目</label>

        <input
          id="customer"
          placeholder="例如：Customer A"
        >

      </div>


      <div>

        <label>订单编号</label>

        <input
          id="orderNo"
          placeholder="例如：A001"
        >

      </div>


      <div>

        <label>收入 / 收款 RM</label>

        <input
          id="income"
          type="number"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div>

        <label>成本 / 支出 RM</label>

        <input
          id="expense"
          type="number"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div>

        <label>付款方式</label>

        <select id="payment">

          <option value="">
            请选择
          </option>

          <option value="Cash">
            Cash
          </option>

          <option value="Bank Transfer">
            Bank Transfer
          </option>

          <option value="QR">
            QR
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="full-column">

        <label>备注</label>

        <input
          id="note"
          placeholder="例如：已收款 / 未收款"
        >

      </div>

    </div>

    <br>

    <button
      class="primary"
      onclick="saveRecord()"
    >
      💾 保存记录
    </button>

    <button
      class="secondary"
      onclick="closeForm()"
    >
      取消
    </button>

    <div id="formMessage"></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <h2>🔎 搜索账单</h2>

    <input
      id="search"
      placeholder="顾客 / 订单编号 / 备注"
      oninput="searchRecords()"
    >

  </div>


  <!-- RECORDS -->

  <div class="card">

    <h2>🧾 账单记录</h2>

    <div id="records">

      <div class="empty">
        加载中...
      </div>

    </div>

  </div>


  <!-- EXPORT -->

  <div class="card">

    <h2>📥 数据</h2>

    <button
      class="secondary"
      onclick="exportCSV()"
    >
      导出 CSV
    </button>

  </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let records = [];

let editId = null;


/* =====================================================
   HELPERS
===================================================== */

function getToday(){

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function money(value){

  return "RM " +
    Number(value || 0).toLocaleString(
      "en-MY",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document
      .getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      '<div class="message error">' +
      '请输入 Email 和 Password' +
      '</div>';

    return;

  }


  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    message.innerHTML =
      '<div class="message error">' +
      escapeHTML(error.message) +
      '</div>';

    return;

  }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function showForgot(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("forgotForm")
    .classList.remove("hidden");

}


function showLogin(){

  document
    .getElementById("forgotForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

}


async function sendResetEmail(){

  const email =
    document
      .getElementById("forgotEmail")
      .value
      .trim();

  const message =
    document
      .getElementById("forgotMessage");

  message.innerHTML = "";


  if(!email){

    message.innerHTML =
      '<div class="message error">' +
      '请输入 Email' +
      '</div>';

    return;

  }


  /*
    IMPORTANT:
    This sends the user to the current website.
    Supabase will return with a recovery session.
  */

  const redirectTo =
    window.location.origin +
    window.location.pathname;


  const {
    error
  } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo
      }
    );


  if(error){

    message.innerHTML =
      '<div class="message error">' +
      escapeHTML(error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '重设密码邮件已经发送。请检查你的 Email。' +
    '</div>';

}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function showResetPage(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.remove("hidden");

}


async function updatePassword(){

  const password =
    document
      .getElementById("newPassword")
      .value;

  const confirm =
    document
      .getElementById("confirmPassword")
      .value;

  const message =
    document
      .getElementById("passwordMessage");

  message.innerHTML = "";


  if(!password){

    message.innerHTML =
      '<div class="message error">' +
      '请输入新密码' +
      '</div>';

    return;

  }


  if(password.length < 6){

    message.innerHTML =
      '<div class="message error">' +
      '密码至少需要 6 个字符' +
      '</div>';

    return;

  }


  if(password !== confirm){

    message.innerHTML =
      '<div class="message error">' +
      '两次密码不一样' +
      '</div>';

    return;

  }


  const {
    error
  } =
    await supabaseClient.auth.updateUser({
      password
    });


  if(error){

    message.innerHTML =
      '<div class="message error">' +
      escapeHTML(error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '密码更新成功！请使用新密码登录。' +
    '</div>';


  setTimeout(
    async () => {

      await supabaseClient.auth.signOut();

      document
        .getElementById("resetPage")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

      showLogin();

    },
    1200
  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  records = [];

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    document
      .getElementById("app")
      .classList.add("hidden");

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    return;

  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("userEmail")
    .innerText = user.email;


  document
    .getElementById("date")
    .value = getToday();


  await loadRecords();

}


/* =====================================================
   LOAD RECORDS
===================================================== */

async function loadRecords(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "date",
        {
          ascending:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    document
      .getElementById("records")
      .innerHTML =
      '<div class="message error">' +
      escapeHTML(error.message) +
      '</div>';

    return;

  }


  records = data || [];

  render(records);

}


/* =====================================================
   FORM
===================================================== */

function openForm(type){

  editId = null;


  document
    .getElementById("formPanel")
    .classList.remove("hidden");


  document
    .getElementById("formTitle")
    .innerText =
      type === "expense"
      ? "新增支出"
      : "新增订单";


  document
    .getElementById("date")
    .value = getToday();


  document
    .getElementById("customer")
    .value = "";


  document
    .getElementById("orderNo")
    .value = "";


  document
    .getElementById("income")
    .value =
      type === "expense"
      ? "0"
      : "";


  document
    .getElementById("expense")
    .value = "";


  document
    .getElementById("payment")
    .value = "";


  document
    .getElementById("note")
    .value = "";


  document
    .getElementById("formMessage")
    .innerHTML = "";


  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function closeForm(){

  document
    .getElementById("formPanel")
    .classList.add("hidden");

  editId = null;

}


/* =====================================================
   SAVE RECORD
===================================================== */

async function saveRecord(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    alert("登录状态已经失效，请重新登录");

    return;

  }


  const date =
    document
      .getElementById("date")
      .value;


  const customer =
    document
      .getElementById("customer")
      .value
      .trim();


  const orderNo =
    document
      .getElementById("orderNo")
      .value
      .trim();


  const income =
    Number(
      document
        .getElementById("income")
        .value || 0
    );


  const expense =
    Number(
      document
        .getElementById("expense")
        .value || 0
    );


  const payment =
    document
      .getElementById("payment")
      .value;


  const note =
    document
      .getElementById("note")
      .value
      .trim();


  const message =
    document
      .getElementById("formMessage");


  message.innerHTML = "";


  if(!date){

    message.innerHTML =
      '<div class="message error">' +
      '请选择日期' +
      '</div>';

    return;

  }


  if(
    income === 0 &&
    expense === 0
  ){

    message.innerHTML =
      '<div class="message error">' +
      '收入或支出至少填写一个金额' +
      '</div>';

    return;

  }


  const payload = {

    date,

    type:
      income > 0
      ? "order"
      : "expense",

    customer,

    order_no:orderNo,

    income,

    expense,

    note:
      payment
      ? `${payment}${note ? " · " + note : ""}`
      : note

  };


  let result;


  /* EDIT */

  if(editId){

    result =
      await supabaseClient
        .from("orders")
        .update(payload)
        .eq("id",editId)
        .eq("user_id",user.id);

  }


  /* NEW */

  else{

    result =
      await supabaseClient
        .from("orders")
        .insert({
          ...payload,
          user_id:user.id
        });

  }


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      escapeHTML(result.error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '保存成功 ✓' +
    '</div>';


  await loadRecords();


  setTimeout(
    () => {

      closeForm();

    },
    600
  );

}


/* =====================================================
   EDIT
===================================================== */

function editRecord(id){

  const record =
    records.find(
      item =>
        String(item.id) === String(id)
    );


  if(!record) return;


  editId = record.id;


  document
    .getElementById("formPanel")
    .classList.remove("hidden");


  document
    .getElementById("formTitle")
    .innerText = "编辑记录";


  document
    .getElementById("date")
    .value = record.date;


  document
    .getElementById("customer")
    .value =
      record.customer || "";


  document
    .getElementById("orderNo")
    .value =
      record.order_no || "";


  document
    .getElementById("income")
    .value =
      record.income || 0;


  document
    .getElementById("expense")
    .value =
      record.expense || 0;


  document
    .getElementById("payment")
    .value = "";


  document
    .getElementById("note")
    .value =
      record.note || "";


  document
    .getElementById("formMessage")
    .innerHTML = "";


  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =====================================================
   DELETE
===================================================== */

async function deleteRecord(id){

  const yes =
    confirm(
      "确定要删除这笔记录吗？"
    );


  if(!yes) return;


  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    alert("请重新登录");

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .delete()
      .eq("id",id)
      .eq("user_id",user.id);


  if(error){

    alert(error.message);

    return;

  }


  await loadRecords();

}


/* =====================================================
   RENDER
===================================================== */

function render(list){

  const container =
    document
      .getElementById("records");


  if(!list.length){

    container.innerHTML =
      '<div class="empty">' +
      '目前没有账单记录' +
      '</div>';

    updateDashboard([]);

    return;

  }


  container.innerHTML =
    list.map(item => {

      const income =
        Number(item.income || 0);

      const expense =
        Number(item.expense || 0);

      const profit =
        income - expense;


      const type =
        item.type === "expense"
        ? "💸"
        : "🧾";


      return `

        <div class="record">

          <div class="record-header">

            <div>

              <div class="record-name">

                ${type}

                ${escapeHTML(
                  item.customer ||
                  item.order_no ||
                  "未命名"
                )}

              </div>

              <div class="record-info">

                日期：${escapeHTML(item.date)}

              </div>

            </div>


            <div class="profit">

              ${money(profit)}

            </div>

          </div>


          <div class="record-info">

            订单编号：
            ${escapeHTML(
              item.order_no || "-"
            )}

          </div>


          <div class="record-info">

            收入：
            ${money(income)}

            &nbsp;&nbsp;

            支出：
            ${money(expense)}

          </div>


          ${
            item.note
            ?
            `
            <div class="record-info">
              备注：
              ${escapeHTML(item.note)}
            </div>
            `
            :
            ""
          }


          <div class="record-actions">

            <button
              class="secondary small"
              onclick="editRecord('${item.id}')"
            >
              ✏️ 编辑
            </button>


            <button
              class="danger small"
              onclick="deleteRecord('${item.id}')"
            >
              🗑️ 删除
            </button>

          </div>

        </div>

      `;

    }).join("");


  updateDashboard(records);

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(list){

  const today =
    getToday();


  const todayRecords =
    list.filter(
      item =>
        item.date === today
    );


  const orders =
    todayRecords.filter(
      item =>
        item.type === "order"
    ).length;


  const income =
    todayRecords.reduce(
      (sum,item) =>
        sum +
        Number(item.income || 0),
      0
    );


  const expense =
    todayRecords.reduce(
      (sum,item) =>
        sum +
        Number(item.expense || 0),
      0
    );


  document
    .getElementById("todayOrders")
    .innerText = orders;


  document
    .getElementById("todayIncome")
    .innerText =
      money(income);


  document
    .getElementById("todayExpense")
    .innerText =
      money(expense);


  document
    .getElementById("todayProfit")
    .innerText =
      money(
        income - expense
      );

}


/* =====================================================
   FILTERS
===================================================== */

function showToday(){

  const result =
    records.filter(
      item =>
        item.date === getToday()
    );

  render(result);

}


function showAll(){

  render(records);

}


function searchRecords(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!keyword){

    render(records);

    return;

  }


  const result =
    records.filter(item => {

      const text = (

        String(item.customer || "") +
        " " +
        String(item.order_no || "") +
        " " +
        String(item.note || "")

      ).toLowerCase();


      return text.includes(keyword);

    });


  render(result);

}


/* =====================================================
   CSV
===================================================== */

function exportCSV(){

  if(!records.length){

    alert("目前没有账单");

    return;

  }


  const rows = [

    [
      "日期",
      "类型",
      "顾客",
      "订单编号",
      "收入",
      "支出",
      "盈利",
      "备注"
    ]

  ];


  records.forEach(item => {

    const income =
      Number(item.income || 0);

    const expense =
      Number(item.expense || 0);


    rows.push([

      item.date,

      item.type,

      item.customer || "",

      item.order_no || "",

      income,

      expense,

      income - expense,

      item.note || ""

    ]);

  });


  const csv =
    "\ufeff" +
    rows
      .map(row =>
        row
          .map(value =>
            `"${String(value)
              .replace(/"/g,'""')}"`
          )
          .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "AB_Business_Book.csv";


  document
    .body
    .appendChild(a);


  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}

    /*
      When user clicks the password

      a recovery session.
    */

    if(event === "PASSWORD_RECOVERY"){

      await showResetPage();

      return;

    }


    if(session){

      await startApp();

    }

    else{

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("resetPage")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

    }

  }
);
