<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB Business Book</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f6f9;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

header{
  background:#111827;
  color:white;
}

header .container{
  padding-top:22px;
  padding-bottom:22px;
}

h1{
  margin:0;
  font-size:25px;
}

h2{
  margin:0 0 15px;
  font-size:19px;
}

p{
  margin:6px 0;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:15px;
  background:white;
}

label{
  display:block;
  margin-bottom:6px;
  color:#64748b;
  font-size:13px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.full{
  width:100%;
}

.hidden{
  display:none!important;
}

.login-box{
  max-width:430px;
  margin:60px auto;
}

.center{
  text-align:center;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.full-column{
  grid-column:1/-1;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:15px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat-title{
  color:#64748b;
  font-size:13px;
}

.stat-value{
  font-size:20px;
  font-weight:700;
  margin-top:7px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:15px;
}

.record{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:14px;
  margin-top:10px;
}

.record-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.record-title{
  font-weight:700;
}

.record-info{
  color:#64748b;
  font-size:13px;
  margin-top:6px;
}

.profit{
  font-weight:700;
}

.record-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.small{
  padding:8px 11px;
  font-size:12px;
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8;
}

@media(max-width:700px){

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full-column{
    grid-column:auto;
  }

  .record-top{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="container">

  <div class="login-box">

    <div class="card">

      <div class="center">
        <h1>AB Business Book</h1>
        <p style="color:#64748b">
          线上生意账本
        </p>
      </div>

      <br>

      <div id="loginBox">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="输入 Email"
        >

        <br><br>

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="输入 Password"
        >

        <br><br>

        <button
          id="loginButton"
          class="primary full"
          type="button"
        >
          🔐 登录
        </button>

        <button
          id="forgotButton"
          class="secondary full"
          style="margin-top:10px"
          type="button"
        >
          忘记密码？
        </button>

        <div id="loginMessage"></div>

      </div>


      <!-- FORGOT -->

      <div id="forgotBox" class="hidden">

        <h2>🔑 忘记密码</h2>

        <p style="color:#64748b;font-size:14px">
          输入你的 Email，我们会发送密码重设邮件。
        </p>

        <label>Email</label>

        <input
          id="forgotEmail"
          type="email"
          placeholder="输入 Email"
        >

        <br><br>

        <button
          id="sendResetButton"
          class="primary full"
          type="button"
        >
          📧 发送重设邮件
        </button>

        <button
          id="backLoginButton"
          class="secondary full"
          style="margin-top:10px"
          type="button"
        >
          返回登录
        </button>

        <div id="forgotMessage"></div>

      </div>

    </div>

  </div>

</div>


<!-- RESET PASSWORD -->

<div id="resetPage" class="container hidden">

  <div class="login-box">

    <div class="card">

      <h2>🔐 设置新密码</h2>

      <label>新密码</label>

      <input
        id="newPassword"
        type="password"
        placeholder="至少 6 个字符"
      >

      <br><br>

      <label>确认密码</label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="再次输入密码"
      >

      <br><br>

      <button
        id="updatePasswordButton"
        class="primary full"
        type="button"
      >
        更新密码
      </button>

      <div id="passwordMessage"></div>

    </div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header>

  <div class="container">

    <h1>AB Business Book</h1>

    <p>订单 · 收入 · 支出 · 盈利</p>

  </div>

</header>


<div class="container">

  <!-- ACCOUNT -->

  <div class="card">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    ">

      <div>

        <div style="
          color:#64748b;
          font-size:13px;
        ">
          登录账号
        </div>

        <strong id="userEmail"></strong>

      </div>

      <button
        id="logoutButton"
        class="secondary small"
        type="button"
      >
        登出
      </button>

    </div>

  </div>


  <!-- DASHBOARD -->

  <div class="dashboard">

    <div class="stat">
      <div class="stat-title">今日订单</div>
      <div id="todayOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">今日收入</div>
      <div id="todayIncome" class="stat-value">RM 0.00</div>
    </div>

    <div class="stat">
      <div class="stat-title">今日支出</div>
      <div id="todayExpense" class="stat-value">RM 0.00</div>
    </div>

    <div class="stat">
      <div class="stat-title">今日盈利</div>
      <div id="todayProfit" class="stat-value">RM 0.00</div>
    </div>

  </div>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      id="newOrderButton"
      class="primary"
      type="button"
    >
      ＋ 新增订单
    </button>

    <button
      id="newExpenseButton"
      class="primary"
      type="button"
    >
      ＋ 新增支出
    </button>

    <button
      id="todayButton"
      class="secondary"
      type="button"
    >
      📅 今天
    </button>

    <button
      id="allButton"
      class="secondary"
      type="button"
    >
      📋 全部
    </button>

  </div>


  <!-- FORM -->

  <div id="formPanel" class="card hidden">

    <h2 id="formTitle">
      新增订单
    </h2>

    <div class="form-grid">

      <div>

        <label>日期</label>

        <input
          id="date"
          type="date"
        >

      </div>


      <div>

        <label>顾客 / 项目</label>

        <input
          id="customer"
          placeholder="例如：Customer A"
        >

      </div>


      <div>

        <label>订单编号</label>

        <input
          id="orderNo"
          placeholder="例如：A001"
        >

      </div>


      <div>

        <label>收入 RM</label>

        <input
          id="income"
          type="number"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div>

        <label>支出 / 成本 RM</label>

        <input
          id="expense"
          type="number"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div>

        <label>付款方式</label>

        <select id="payment">

          <option value="">请选择</option>
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="QR">QR</option>
          <option value="Other">Other</option>

        </select>

      </div>


      <div class="full-column">

        <label>备注</label>

        <input
          id="note"
          placeholder="例如：已收款"
        >

      </div>

    </div>

    <br>

    <button
      id="saveButton"
      class="primary"
      type="button"
    >
      💾 保存记录
    </button>

    <button
      id="cancelButton"
      class="secondary"
      type="button"
    >
      取消
    </button>

    <div id="formMessage"></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <h2>🔎 搜索账单</h2>

    <input
      id="searchInput"
      placeholder="搜索顾客、订单编号、备注"
    >

  </div>


  <!-- RECORDS -->

  <div class="card">

    <h2>🧾 账单记录</h2>

    <div id="records">

      <div class="empty">
        加载中...
      </div>

    </div>

  </div>


  <!-- EXPORT -->

  <div class="card">

    <h2>📥 数据</h2>

    <button
      id="exportButton"
      class="secondary"
      type="button"
    >
      导出 CSV
    </button>

  </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let records = [];

let editingId = null;

let currentFilter = "all";


/* =====================================================
   HELPERS
===================================================== */

function getToday(){

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return year + "-" + month + "-" + day;

}


function money(value){

  return "RM " +
    Number(value || 0).toLocaleString(
      "en-MY",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document
      .getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      '<div class="message error">' +
      '请输入 Email 和 Password' +
      '</div>';

    return;

  }


  const result =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      safe(result.error.message) +
      '</div>';

    return;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  records = [];

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function openForgot(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("forgotBox")
    .classList.remove("hidden");

}


function closeForgot(){

  document
    .getElementById("forgotBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

}


async function sendResetEmail(){

  const email =
    document
      .getElementById("forgotEmail")
      .value
      .trim();

  const message =
    document
      .getElementById("forgotMessage");

  message.innerHTML = "";

  if(!email){

    message.innerHTML =
      '<div class="message error">' +
      '请输入 Email' +
      '</div>';

    return;

  }


  const redirectTo =
    window.location.origin +
    window.location.pathname;


  const result =
    await supabaseClient.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:redirectTo
        }
      );


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      safe(result.error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '邮件已发送，请检查 Inbox / Spam / Junk。' +
    '</div>';

}


/* =====================================================
   RESET PASSWORD
===================================================== */

function openResetPage(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.remove("hidden");

}


async function updatePassword(){

  const password =
    document
      .getElementById("newPassword")
      .value;

  const confirm =
    document
      .getElementById("confirmPassword")
      .value;

  const message =
    document
      .getElementById("passwordMessage");

  message.innerHTML = "";

  if(password.length < 6){

    message.innerHTML =
      '<div class="message error">' +
      '密码至少需要 6 个字符' +
      '</div>';

    return;

  }


  if(password !== confirm){

    message.innerHTML =
      '<div class="message error">' +
      '两次密码不一样' +
      '</div>';

    return;

  }


  const result =
    await supabaseClient.auth.updateUser({
      password:password
    });


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      safe(result.error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '密码更新成功！' +
    '</div>';


  setTimeout(
    async function(){

      await supabaseClient.auth.signOut();

      document
        .getElementById("resetPage")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

    },
    1200
  );

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  const result =
    await supabaseClient.auth.getUser();

  if(result.error || !result.data.user){

    return;

  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("resetPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("userEmail")
    .innerText =
      result.data.user.email;


  document
    .getElementById("date")
    .value =
      getToday();


  await loadRecords();

}


/* =====================================================
   LOAD
===================================================== */

async function loadRecords(){

  const result =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "date",
        {
          ascending:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    document
      .getElementById("records")
      .innerHTML =
      '<div class="message error">' +
      safe(result.error.message) +
      '</div>';

    return;

  }


  records =
    result.data || [];


  render();

}


/* =====================================================
   FORM
===================================================== */

function openForm(type){

  editingId = null;

  document
    .getElementById("formPanel")
    .classList.remove("hidden");


  document
    .getElementById("formTitle")
    .innerText =
      type === "expense"
      ? "新增支出"
      : "新增订单";


  document
    .getElementById("date")
    .value =
      getToday();


  document
    .getElementById("customer")
    .value = "";

  document
    .getElementById("orderNo")
    .value = "";

  document
    .getElementById("income")
    .value =
      type === "expense"
      ? "0"
      : "";

  document
    .getElementById("expense")
    .value = "";

  document
    .getElementById("payment")
    .value = "";

  document
    .getElementById("note")
    .value = "";

  document
    .getElementById("formMessage")
    .innerHTML = "";


  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function closeForm(){

  document
    .getElementById("formPanel")
    .classList.add("hidden");

  editingId = null;

}


/* =====================================================
   SAVE
===================================================== */

async function saveRecord(){

  const userResult =
    await supabaseClient.auth.getUser();

  if(
    userResult.error ||
    !userResult.data.user
  ){

    alert("登录已经失效，请重新登录");

    return;

  }


  const date =
    document
      .getElementById("date")
      .value;

  const customer =
    document
      .getElementById("customer")
      .value
      .trim();

  const orderNo =
    document
      .getElementById("orderNo")
      .value
      .trim();

  const income =
    Number(
      document
        .getElementById("income")
        .value || 0
    );

  const expense =
    Number(
      document
        .getElementById("expense")
        .value || 0
    );

  const payment =
    document
      .getElementById("payment")
      .value;

  const note =
    document
      .getElementById("note")
      .value
      .trim();


  const message =
    document
      .getElementById("formMessage");


  message.innerHTML = "";


  if(!date){

    message.innerHTML =
      '<div class="message error">' +
      '请选择日期' +
      '</div>';

    return;

  }


  if(
    income <= 0 &&
    expense <= 0
  ){

    message.innerHTML =
      '<div class="message error">' +
      '收入或支出至少填写一个金额' +
      '</div>';

    return;

  }


  let finalNote = note;

  if(payment){

    finalNote =
      payment +
      (
        note
        ? " · " + note
        : ""
      );

  }


  const payload = {

    date:date,

    type:
      income > 0
      ? "order"
      : "expense",

    customer:customer,

    order_no:orderNo,

    income:income,

    expense:expense,

    note:finalNote

  };


  let result;


  if(editingId){

    result =
      await supabaseClient
        .from("orders")
        .update(payload)
        .eq("id",editingId);

  }

  else{

    result =
      await supabaseClient
        .from("orders")
        .insert({

          ...payload,

          user_id:
            userResult.data.user.id

        });

  }


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      safe(result.error.message) +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message success">' +
    '保存成功 ✓' +
    '</div>';


  await loadRecords();


  setTimeout(
    function(){

      closeForm();

    },
    600
  );

}


/* =====================================================
   EDIT
===================================================== */

function editRecord(id){

  const item =
    records.find(
      function(row){

        return String(row.id) === String(id);

      }
    );


  if(!item) return;


  editingId =
    item.id;


  document
    .getElementById("formPanel")
    .classList.remove("hidden");


  document
    .getElementById("formTitle")
    .innerText =
      "编辑记录";


  document
    .getElementById("date")
    .value =
      item.date || getToday();

  document
    .getElementById("customer")
    .value =
      item.customer || "";

  document
    .getElementById("orderNo")
    .value =
      item.order_no || "";

  document
    .getElementById("income")
    .value =
      item.income || 0;

  document
    .getElementById("expense")
    .value =
      item.expense || 0;

  document
    .getElementById("payment")
    .value = "";

  document
    .getElementById("note")
    .value =
      item.note || "";

  document
    .getElementById("formMessage")
    .innerHTML = "";


  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =====================================================
   DELETE
===================================================== */

async function deleteRecord(id){

  if(
    !confirm(
      "确定要删除这笔记录吗？"
    )
  ){

    return;

  }


  const result =
    await supabaseClient
      .from("orders")
      .delete()
      .eq("id",id);


  if(result.error){

    alert(result.error.message);

    return;

  }


  await loadRecords();

}


/* =====================================================
   FILTER
===================================================== */

function getFilteredRecords(){

  let list =
    [...records];


  if(currentFilter === "today"){

    const today =
      getToday();

    list =
      list.filter(
        function(item){

          if(!item.date){

            return false;

          }

          return String(
            item.date
          ).substring(0,10) === today;

        }
      );

  }


  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  if(keyword){

    list =
      list.filter(
        function(item){

          const text =

            String(
              item.customer || ""
            ) +

            " " +

            String(
              item.order_no || ""
            ) +

            " " +

            String(
              item.note || ""
            );


          return text
            .toLowerCase()
            .includes(keyword);

        }
      );

  }


  return list;

}


/* =====================================================
   TODAY / ALL
===================================================== */

function showToday(){

  currentFilter =
    "today";

  render();

}


function showAll(){

  currentFilter =
    "all";

  render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const list =
    getFilteredRecords();


  const container =
    document
      .getElementById("records");


  if(!list.length){

    container.innerHTML =
      '<div class="empty">' +
      (
        currentFilter === "today"
        ? "今天还没有记录"
        : "目前没有记录"
      ) +
      '</div>';

  }

  else{

    container.innerHTML =
      list.map(
        function(item){

          const income =
            Number(item.income || 0);

          const expense =
            Number(item.expense || 0);

          const profit =
            income - expense;


          const icon =
            item.type === "expense"
            ? "💸"
            : "🧾";


          return `

            <div class="record">

              <div class="record-top">

                <div>

                  <div class="record-title">

                    ${icon}

                    ${safe(
                      item.customer ||
                      item.order_no ||
                      "未命名"
                    )}

                  </div>

                  <div class="record-info">

                    日期：
                    ${safe(item.date)}

                  </div>

                </div>


                <div class="profit">

                  ${money(profit)}

                </div>

              </div>


              <div class="record-info">

                订单编号：
                ${safe(
                  item.order_no || "-"
                )}

              </div>


              <div class="record-info">

                收入：
                ${money(income)}

                &nbsp;&nbsp;

                支出：
                ${money(expense)}

              </div>


              ${
                item.note
                ?
                `
                <div class="record-info">
                  备注：
                  ${safe(item.note)}
                </div>
                `
                :
                ""
              }


              <div class="record-buttons">

                <button
                  class="secondary small"
                  type="button"
                  onclick="editRecord('${item.id}')"
                >
                  ✏️ 编辑
                </button>

                <button
                  class="danger small"
                  type="button"
                  onclick="deleteRecord('${item.id}')"
                >
                  🗑️ 删除
                </button>

              </div>

            </div>

          `;

        }
      ).join("");

  }


  updateDashboard();

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

  const today =
    getToday();


  const list =
    records.filter(
      function(item){

        return String(
          item.date || ""
        ).substring(0,10) === today;

      }
    );


  const orders =
    list.filter(
      function(item){

        return item.type === "order";

      }
    ).length;


  const income =
    list.reduce(
      function(total,item){

        return total +
          Number(item.income || 0);

      },
      0
    );


  const expense =
    list.reduce(
      function(total,item){

        return total +
          Number(item.expense || 0);

      },
      0
    );


  document
    .getElementById("todayOrders")
    .innerText =
      orders;


  document
    .getElementById("todayIncome")
    .innerText =
      money(income);


  document
    .getElementById("todayExpense")
    .innerText =
      money(expense);


  document
    .getElementById("todayProfit")
    .innerText =
      money(
        income - expense
      );

}


/* =====================================================
   CSV
===================================================== */

function exportCSV(){

  if(!records.length){

    alert("目前没有记录");

    return;

  }


  const rows = [

    [
      "日期",
      "类型",
      "顾客",
      "订单编号",
      "收入",
      "支出",
      "盈利",
      "备注"
    ]

  ];


  records.forEach(
    function(item){

      const income =
        Number(item.income || 0);

      const expense =
        Number(item.expense || 0);


      rows.push([

        item.date || "",

        item.type || "",

        item.customer || "",

        item.order_no || "",

        income,

        expense,

        income - expense,

        item.note || ""

      ]);

    }
  );


  const csv =
    "\ufeff" +

    rows.map(
      function(row){

        return row.map(
          function(value){

            return '"' +
              String(value)
                .replace(/"/g,'""') +
              '"';

          }
        ).join(",");

      }
    ).join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "AB_Business_Book.csv";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

    ){

      openResetPage();

      return;

    }


    if(session){

      await startApp();

    }

    else{

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("resetPage")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

    }

  }
);
