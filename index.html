<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB Business Book</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f7fb;
  font-family:Arial,sans-serif;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:20px
}
.container{
  max-width:900px;
  margin:auto;
  padding:15px
}
h1{margin:0;font-size:23px}
h2{font-size:18px}
header p{color:#cbd5e1}
.card{
  background:white;
  padding:16px;
  border-radius:15px;
  box-shadow:0 2px 10px #0001;
  margin-bottom:12px
}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.card-title{
  color:#64748b;
  font-size:13px
}
.card-value{
  font-size:21px;
  font-weight:bold;
  margin-top:6px
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:15px 0
}
button{
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer
}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
input{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:15px
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.full{grid-column:1/-1}
label{
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:5px
}
.record{
  border:1px solid #e5e7eb;
  padding:14px;
  border-radius:12px;
  margin-top:10px
}
.record-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.info{
  color:#64748b;
  font-size:13px;
  margin-top:5px
}
.hidden{display:none}
.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8
}
.error{
  color:#b91c1c;
  background:#fee2e2;
  padding:10px;
  border-radius:10px;
  margin-top:10px
}
.success{
  color:#166534;
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin-top:10px
}
.small{
  padding:8px 10px;
  font-size:12px;
  margin-top:10px
}
@media(min-width:700px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .buttons{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">

  <div class="card" style="margin-top:50px">

    <h1>AB Business Book</h1>

    <p>登录你的生意账本</p>

    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="你的 Email">

    <br><br>

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="密码">

    <br><br>

    <button class="primary" style="width:100%" onclick="login()">
      🔐 登录
    </button>
    <button
  class="secondary"
  style="width:100%;margin-top:10px"
  onclick="showForgotPassword()">
  忘记密码？
</button>

    <div id="loginMessage"></div>
    <div id="forgotPanel" class="hidden" style="margin-top:20px">

  <h2>重设密码</h2>

  <p style="color:#64748b;font-size:14px">
    输入你的 Email，我们会发送密码重设链接。
  </p>

  <input
    id="resetEmail"
    type="email"
    placeholder="你的 Email">

  <br><br>

  <button
    class="primary"
    style="width:100%"
    onclick="sendResetEmail()">
    📧 发送重设邮件
  </button>

  <button
    class="secondary"
    style="width:100%;margin-top:10px"
    onclick="hideForgotPassword()">
    返回登录
  </button>

  <div id="resetMessage"></div>

</div>

  </div>

</div>


<!-- MAIN APP -->
<div id="app" class="hidden">

<header>
  <div class="container">
    <h1>AB Business Book</h1>
    <p>订单 · 收入 · 支出 · 盈利</p>
  </div>
</header>

<div class="container">

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="card-title">登录账号</div>
        <div id="userEmail"></div>
      </div>

      <button class="secondary small" onclick="logout()">
        登出
      </button>
    </div>
  </div>


  <!-- DASHBOARD -->

  <div class="cards">

    <div class="card">
      <div class="card-title">今日订单</div>
      <div class="card-value" id="todayOrders">0</div>
    </div>

    <div class="card">
      <div class="card-title">今日收入</div>
      <div class="card-value" id="todayIncome">RM 0.00</div>
    </div>

    <div class="card">
      <div class="card-title">今日支出</div>
      <div class="card-value" id="todayExpense">RM 0.00</div>
    </div>

    <div class="card">
      <div class="card-title">今日盈利</div>
      <div class="card-value" id="todayProfit">RM 0.00</div>
    </div>

  </div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button class="primary" onclick="openForm('order')">
      ＋ 新增订单
    </button>

    <button class="primary" onclick="openForm('expense')">
      ＋ 记录支出
    </button>

    <button class="secondary" onclick="showToday()">
      📅 今日账单
    </button>

    <button class="secondary" onclick="showAll()">
      📋 全部账单
    </button>

  </div>


  <!-- FORM -->

  <div class="card hidden" id="formPanel">

    <h2 id="formTitle">新增订单</h2>

    <div class="form-grid">

      <div>
        <label>日期</label>
        <input type="date" id="date">
      </div>

      <div>
        <label>顾客 / 项目</label>
        <input id="customer" placeholder="例如 Customer A">
      </div>

      <div>
        <label>订单编号</label>
        <input id="orderNo" placeholder="例如 A001">
      </div>

      <div>
        <label>收入 / 收款 RM</label>
        <input id="income" type="number" step="0.01" placeholder="0.00">
      </div>

      <div>
        <label>成本 / 支出 RM</label>
        <input id="expense" type="number" step="0.01" placeholder="0.00">
      </div>

      <div class="full">
        <label>备注</label>
        <input id="note" placeholder="现金 / 转账 / 已收款等">
      </div>

    </div>

    <br>

    <button class="primary" onclick="saveRecord()">
      保存记录
    </button>

    <button class="secondary" onclick="closeForm()">
      取消
    </button>

    <div id="formMessage"></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <h2>🔎 搜索账单</h2>

    <input
      id="search"
      placeholder="输入顾客或订单编号"
      oninput="searchRecords()"
    >

  </div>


  <!-- RECORDS -->

  <div class="card">

    <h2>🧾 账单记录</h2>

    <div id="records">
      <div class="empty">加载中...</div>
    </div>

  </div>


  <!-- EXPORT -->

  <div class="card">

    <h2>数据管理</h2>

    <button class="secondary" onclick="exportCSV()">
      📥 导出 CSV
    </button>

  </div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL = "https://mcjrtpltfcaeejsomfeh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_8PXzqZd-tRB2z07a-OKBAw_zkOoGXMO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================
   VARIABLES
================================ */

let records = [];
let editId = null;


/* ================================
   BASIC FUNCTIONS
================================ */

function today(){

  const d = new Date();

  return d.toISOString().slice(0,10);

}


function money(value){

  return "RM " +
    Number(value || 0).toLocaleString(
      "en-MY",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* ================================
   LOGIN
================================ */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      '<div class="error">请输入 Email 和 Password</div>';

    return;

  }

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    return;

  }

  await startApp();

}


/* ================================
   LOGOUT
================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* ================================
   START APP
================================ */

async function startApp(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();

  if(!user){

    document
      .getElementById("app")
      .classList.add("hidden");

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    return;

  }

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .innerText = user.email;

  document
    .getElementById("date")
    .value = today();

  await loadRecords();

}


/* ================================
   LOAD RECORDS
================================ */

async function loadRecords(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("date", {ascending:false})
      .order("created_at", {ascending:false});

  if(error){

    console.error(error);

    document
      .getElementById("records")
      .innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    return;

  }

  records = data || [];

  render(records);

}


/* ================================
   OPEN FORM
================================ */

function openForm(type){

  editId = null;

  document
    .getElementById("formPanel")
    .classList.remove("hidden");

  document
    .getElementById("formTitle")
    .innerText =
      type === "expense"
      ? "记录支出"
      : "新增订单";

  document
    .getElementById("date")
    .value = today();

  document
    .getElementById("customer")
    .value = "";

  document
    .getElementById("orderNo")
    .value = "";

  document
    .getElementById("income")
    .value =
      type === "expense"
      ? "0"
      : "";

  document
    .getElementById("expense")
    .value = "";

  document
    .getElementById("note")
    .value = "";

  document
    .getElementById("formMessage")
    .innerHTML = "";

  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function closeForm(){

  document
    .getElementById("formPanel")
    .classList.add("hidden");

  editId = null;

}


/* ================================
   SAVE RECORD
================================ */

async function saveRecord(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();

  if(!user){

    alert("请先登录");

    return;

  }

  const date =
    document.getElementById("date").value;

  const customer =
    document.getElementById("customer").value.trim();

  const orderNo =
    document.getElementById("orderNo").value.trim();

  const income =
    Number(
      document.getElementById("income").value || 0
    );

  const expense =
    Number(
      document.getElementById("expense").value || 0
    );

  const note =
    document.getElementById("note").value.trim();

  const message =
    document.getElementById("formMessage");

  if(!date){

    message.innerHTML =
      '<div class="error">请选择日期</div>';

    return;

  }

  if(!customer && !orderNo && !note){

    message.innerHTML =
      '<div class="error">请填写顾客、订单编号或备注</div>';

    return;

  }


  /* EDIT */

  if(editId){

    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .update({
          date,
          customer,
          order_no:orderNo,
          income,
          expense,
          note
        })
        .eq("id", editId)
        .eq("user_id", user.id);

    if(error){

      message.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;

    }

  }

  /* NEW */

  else{

    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .insert({
          user_id:user.id,
          date,
          type: income > 0 ? "order" : "expense",
          customer,
          order_no:orderNo,
          income,
          expense,
          note
        });

    if(error){

      message.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;

    }

  }

  message.innerHTML =
    '<div class="success">保存成功 ✓</div>';

  editId = null;

  await loadRecords();

  setTimeout(
    closeForm,
    500
  );

}


/* ================================
   EDIT
================================ */

function editRecord(id){

  const record =
    records.find(
      item => String(item.id) === String(id)
    );

  if(!record) return;

  editId = record.id;

  document
    .getElementById("formPanel")
    .classList.remove("hidden");

  document
    .getElementById("formTitle")
    .innerText = "编辑订单";

  document
    .getElementById("date")
    .value = record.date;

  document
    .getElementById("customer")
    .value = record.customer || "";

  document
    .getElementById("orderNo")
    .value = record.order_no || "";

  document
    .getElementById("income")
    .value = record.income || 0;

  document
    .getElementById("expense")
    .value = record.expense || 0;

  document
    .getElementById("note")
    .value = record.note || "";

  document
    .getElementById("formMessage")
    .innerHTML = "";

  document
    .getElementById("formPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* ================================
   DELETE
================================ */

async function deleteRecord(id){

  if(!confirm("确定删除这笔记录吗？")){

    return;

  }

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .delete()
      .eq("id",id)
      .eq("user_id",user.id);

  if(error){

    alert(error.message);

    return;

  }

  await loadRecords();

}


/* ================================
   RENDER
================================ */

function render(list){

  const container =
    document.getElementById("records");

  if(!list.length){

    container.innerHTML =
      '<div class="empty">目前没有账单记录</div>';

    updateDashboard([]);

    return;

  }

  container.innerHTML =
    list.map(item => {

      const profit =
        Number(item.income || 0)
        -
        Number(item.expense || 0);

      return `

        <div class="record">

          <div class="record-top">

            <strong>
              ${item.type === "expense" ? "💸" : "🧾"}
              ${escapeHTML(
                item.customer ||
                item.order_no ||
                "未命名"
              )}
            </strong>

            <strong>
              ${money(profit)}
            </strong>

          </div>

          <div class="info">
            日期：${item.date}
          </div>

          <div class="info">
            订单编号：
            ${escapeHTML(item.order_no || "-")}
          </div>

          <div class="info">
            收入：${money(item.income)}
            &nbsp;&nbsp;
            支出：${money(item.expense)}
          </div>

          ${
            item.note
            ?
            `<div class="info">
              备注：${escapeHTML(item.note)}
            </div>`
            :
            ""
          }

          <button
            class="secondary small"
            onclick="editRecord('${item.id}')"
          >
            ✏️ 编辑
          </button>

          <button
            class="danger small"
            onclick="deleteRecord('${item.id}')"
          >
            🗑️ 删除
          </button>

        </div>

      `;

    }).join("");

  updateDashboard(records);

}


/* ================================
   DASHBOARD
================================ */

function updateDashboard(list){

  const todayRecords =
    list.filter(
      item => item.date === today()
    );

  const orders =
    todayRecords.filter(
      item => item.type === "order"
    ).length;

  const income =
    todayRecords.reduce(
      (sum,item) =>
        sum + Number(item.income || 0),
      0
    );

  const expense =
    todayRecords.reduce(
      (sum,item) =>
        sum + Number(item.expense || 0),
      0
    );

  document
    .getElementById("todayOrders")
    .innerText = orders;

  document
    .getElementById("todayIncome")
    .innerText = money(income);

  document
    .getElementById("todayExpense")
    .innerText = money(expense);

  document
    .getElementById("todayProfit")
    .innerText =
      money(income - expense);

}


/* ================================
   TODAY
================================ */

function showToday(){

  const list =
    records.filter(
      item => item.date === today()
    );

  render(list);

}


/* ================================
   ALL
================================ */

function showAll(){

  render(records);

}


/* ================================
   SEARCH
================================ */

function searchRecords(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!keyword){

    render(records);

    return;

  }

  const result =
    records.filter(item => {

      const customer =
        String(item.customer || "")
          .toLowerCase();

      const orderNo =
        String(item.order_no || "")
          .toLowerCase();

      return (
        customer.includes(keyword) ||
        orderNo.includes(keyword)
      );

    });

  render(result);

}


/* ================================
   CSV EXPORT
================================ */

function exportCSV(){

  if(!records.length){

    alert("目前没有账单");

    return;

  }

  let rows = [

    [
      "日期",
      "类型",
      "顾客",
      "订单编号",
      "收入",
      "支出",
      "盈利",
      "备注"
    ]

  ];

  records.forEach(item => {

    rows.push([

      item.date,

      item.type,

      item.customer || "",

      item.order_no || "",

      item.income || 0,

      item.expense || 0,

      Number(item.income || 0)
      -
      Number(item.expense || 0),

      item.note || ""

    ]);

  });

  const csv =
    "\ufeff" +
    rows
      .map(row =>
        row
          .map(value =>
            `"${String(value)
              .replace(/"/g,'""')}"`
          )
          .join(",")
      )
      .join("\n");

  const blob =
    new Blob(
      [csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "AB_Business_Book.csv";

  a.click();

  URL.revokeObjectURL(url);

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   CHECK SESSION
================================ */

supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(event === "PASSWORD_RECOVERY"){

      const newPassword =
        prompt("请输入新的密码：");

      if(newPassword){

        const {error} =
          await supabaseClient.auth.updateUser({
            password:newPassword
          });

        if(error){

          alert(
            "密码更新失败：" +
            error.message
          );

        }else{

          alert(
            "密码已经成功更新！"
          );

          await logout();

        }

      }

      return;
    }

    if(session){

      await startApp();

    }else{

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

    }

  }
);

    if(session){

      await startApp();

    }else{

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

    }

  }
);

function showForgotPassword(){

  document
    .getElementById("forgotPanel")
    .classList.remove("hidden");

}


function hideForgotPassword(){

  document
    .getElementById("forgotPanel")
    .classList.add("hidden");

}


async function sendResetEmail(){

  const email =
    document
      .getElementById("resetEmail")
      .value
      .trim();

  const message =
    document
      .getElementById("resetMessage");

  if(!email){

    message.innerHTML =
      '<div class="error">请输入 Email</div>';

    return;

  }

  const redirectUrl =
    window.location.origin +
    window.location.pathname;

  const {error} =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectUrl
      }
    );

  if(error){

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    return;

  }

  message.innerHTML =
    '<div class="success">' +
    '重设密码邮件已经发送，请检查你的 Email。' +
    '</div>';

}</script>

</body>
</html>
